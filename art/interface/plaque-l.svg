<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- La plaque « L » des apprentis : l'entraînement. Dans la palette des autres pictos du menu —
       encre, crème, rouge —, penchée comme une plaque qu'on vient de poser, avec ses deux vis. -->
  <g transform="rotate(-9 128 128)">
    <!-- la plaque -->
    <rect x="34" y="34" width="188" height="188" rx="18" fill="#f4ecd6" stroke="#14110f" stroke-width="11"/>
    <rect x="52" y="52" width="152" height="152" rx="8" fill="none" stroke="#14110f" stroke-width="3" opacity=".18"/>
    <!-- le L -->
    <path d="M86 66 H130 V160 H184 V200 H86 Z" fill="#e33228" stroke="#14110f" stroke-width="9" stroke-linejoin="round"/>
    <!-- le reflet de l'encre sur le rouge, et l'usure du blanc -->
    <path d="M100 80 V148" stroke="#ff8a7a" stroke-width="7" stroke-linecap="round" opacity=".55"/>
    <path d="M100 174 H168" stroke="#ff8a7a" stroke-width="6" stroke-linecap="round" opacity=".45"/>
    <g fill="#14110f" opacity=".16">
      <circle cx="160" cy="84" r="2.6"/><circle cx="176" cy="112" r="1.8"/><circle cx="150" cy="128" r="2.2"/>
      <circle cx="62" cy="120" r="2"/><circle cx="70" cy="176" r="2.4"/><circle cx="190" cy="68" r="1.6"/>
    </g>
    <g fill="#fff8ea" opacity=".5">
      <circle cx="112" cy="190" r="2.2"/><circle cx="116" cy="104" r="1.8"/><circle cx="150" cy="182" r="2"/>
    </g>
    <!-- les deux vis du haut -->
    <g stroke="#14110f" stroke-width="4">
      <circle cx="166" cy="62" r="7" fill="#c9c1ad"/><circle cx="62" cy="194" r="7" fill="#c9c1ad"/>
    </g>
    <path d="M161 62 h10 M57 194 h10" stroke="#14110f" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
