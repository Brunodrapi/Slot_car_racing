<!doctype html><html lang="fr"><meta charset="utf-8"><title>GRIP — correctif Chrome / Edge recette</title>
<style>body{margin:0;background:#14251f;color:#f3e5c6;font:14px system-ui}iframe{position:fixed;width:100%;height:100%;border:0}details{position:fixed;top:8px;left:8px;background:#14251fee;padding:8px;max-width:320px}</style>
<iframe id="game" src="../index.html" allow="gamepad; fullscreen"></iframe>
<details><summary>Correctif Chrome / Edge · recette</summary><p id="status">Chargement…</p><p>Cache 8 px/m provisoire. Le rendu habituel reste actif pendant sa préparation. Aucun changement en production.</p></details>
<script>
const frame=document.querySelector('#game'),status=document.querySelector('#status');
async function setup(){
 const w=frame.contentWindow;
 if(!w.app?.renderer){setTimeout(setup,100);return;}
 if(w.eval('APP_CANAL')!=='recette'){status.textContent='Réservé à la recette.';return;}
 try{
 for(const src of ['tools/backdrop-cache-prototype.js?v=backdrop-3','tools/chromium-cache-fix.js?v=1'])await new Promise((resolve,reject)=>{const s=w.document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;w.document.head.append(s);});
 if(!w.installChromiumCacheFix(w.app)){status.textContent='Rendu habituel conservé : correctif réservé à Chrome / Edge sur PC.';return;}
 setInterval(()=>{const r=w.app.renderer,s=r.backdropStats;status.textContent=r.chromiumCacheFix.error?'Retour au rendu habituel : '+r.chromiumCacheFix.error:r.chromiumCacheFix.building?'Préparation du cache…':s.ready?`Cache actif : ${s.scale} px/m · ${Math.round(s.bytes/1048576)} Mio`:'Prêt : choisissez une course.';},500);
 }catch(e){status.textContent='Correctif indisponible : '+e.message;}
}
setup();
</script></html>
