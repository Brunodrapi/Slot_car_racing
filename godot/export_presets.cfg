[preset.2.options]

variant/extensions_support=true
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
html/head_include="<script>
// Au plus deux pixels par point : net sur un iPhone (il en a trois), sans neuf fois plus de pixels à peindre.
(function () { try { var d = Object.getOwnPropertyDescriptor(window, 'devicePixelRatio') || Object.getOwnPropertyDescriptor(Window.prototype, 'devicePixelRatio'); var lit = d && d.get ? function () { return d.get.call(window); } : function () { return 1; }; if (lit() > 2) Object.defineProperty(window, 'devicePixelRatio', { configurable: true, get: function () { return Math.min(2, lit()); } }); } catch (e) {} })();
// Une page neuve avec un moteur resté en cache, d'une version précédente : le moteur refuse de démarrer.
// On vide les caches de l'application et son service worker, puis on recharge, une fois.
(function () { var MOTS = /GDExtension libraries are not supported|CompileError|LinkError/; function repare() { try { if (sessionStorage.getItem('gripRepare')) return; sessionStorage.setItem('gripRepare', '1'); } catch (e) { return; } var fin = function () { location.reload(); }; Promise.all(['caches' in window ? caches.keys().then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n); })); }) : 0, navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }) : 0]).then(fin, fin); } document.addEventListener('DOMContentLoaded', function () { var n = document.getElementById('status-notice'); if (n) new MutationObserver(function () { if (MOTS.test(n.textContent || '')) repare(); }).observe(n, { childList: true, subtree: true, characterData: true }); }); })();
window.addEventListener('beforeinstallprompt', event => { event.preventDefault(); window.gripInvite = event; });
window.addEventListener('appinstalled', () => { window.gripInstalle = true; window.gripInvite = null; });
</script>"
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=false

