[preset.2]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="donnees/*.bin, donnees/*.json"
exclude_filter="tests/*, donnees/ref/*, outils/*, donnees/circuits/*-decor.*, natif/*, exports/*, addons/godotsteam/*"
export_path="exports/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.2.options]

variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
html/head_include="<script>
window.addEventListener('beforeinstallprompt', event => { event.preventDefault(); window.gripInvite = event; });
window.addEventListener('appinstalled', () => { window.gripInstalle = true; window.gripInvite = null; });
</script>"
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=false

