[preset.0]

name="Windows"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="donnees/*.bin, donnees/*.json"
exclude_filter="tests/*, donnees/ref/*, outils/*, donnees/circuits/*-decor.*, exports/*, addons/godotsteam/*"
export_path="exports/windows/SLOTLESS.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
application/modify_resources=false
application/product_name="SLOTLESS"
debug/export_console_wrapper=0

